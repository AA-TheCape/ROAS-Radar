steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - dashboard/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPOSITORY}/${_IMAGE_NAME_DASHBOARD}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REGISTRY_REPOSITORY}/${_IMAGE_NAME_DASHBOARD}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl xz-utils
        NODE_VERSION="${_NODE_VERSION}"
        NODE_ARCH="$(dpkg --print-architecture)"
        case "$NODE_ARCH" in
          amd64) NODE_DIST_ARCH=x64 ;;
          arm64) NODE_DIST_ARCH=arm64 ;;
          *) echo "unsupported Node architecture: $NODE_ARCH" >&2; exit 1 ;;
        esac
        curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_DIST_ARCH}.tar.xz" \
          | tar -xJ --strip-components=1 -C /usr/local
        node --version
        SHORT_SHA="$SHORT_SHA" \
        RUN_MIGRATIONS_ON_DEPLOY="${_RUN_MIGRATIONS_ON_DEPLOY}" \
        APPLY_MONITORING_ON_DEPLOY="${_APPLY_MONITORING_ON_DEPLOY}" \
        SKIP_BUILDS=true \
        bash ./infra/cloud-run/promote.sh staging

substitutions:
  _REGION: us-central1
  _ARTIFACT_REGISTRY_REPOSITORY: roas-radar
  _IMAGE_NAME: roas-radar-app
  _IMAGE_NAME_DASHBOARD: roas-radar-dashboard
  _NODE_VERSION: "22.13.0"
  _RUN_MIGRATIONS_ON_DEPLOY: "true"
  _APPLY_MONITORING_ON_DEPLOY: "true"

options:
  logging: CLOUD_LOGGING_ONLY
